name: Build separate PNG game assets
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_assets.py"
      - "assets/actions.webp"
      - "assets/icons.webp"
      - "assets/avatar.webp"
      - "assets/location.webp"
      - "public/img/cultivator.svg"
      - ".github/workflows/build-assets.yml"

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: pip install pillow cairosvg
      - name: Generate separate PNG assets
        run: python scripts/build_assets.py
      - name: Commit generated PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "assets: generate separate PNG UI files"
            git push
          fi
