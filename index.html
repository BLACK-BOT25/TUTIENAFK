<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111e">
<title>Tu Tiên AFK</title>
<link rel="stylesheet" href="./game.css">
</head>
<body>
<main id="app" aria-label="Tu Tiên AFK">
  <img id="bgArt" class="bg-art" alt="">
  <div class="mist-layer"></div>
  <img id="heroArt" class="hero-art" alt="Diệp Mặc đang tu luyện">

  <section class="profile-zone">
    <img id="profilePanelArt" class="zone-art" alt="">
    <img src="./assets/avatar.webp" class="profile-avatar" alt="Diệp Mặc">
    <div class="profile-copy">
      <b id="name">Diệp Mặc</b>
      <span id="realm">Luyện Khí tầng 1</span>
      <div class="mini-progress"><i id="miniFill"></i><em id="miniText">0 / 100 Tu Vi</em></div>
    </div>
  </section>

  <section class="resources" aria-label="Tài nguyên">
    <button class="resource-btn" data-open="shop"><img id="resGemArt" alt=""><b id="gems">30</b></button>
    <button class="resource-btn" data-open="shop"><img id="resGoldArt" alt=""><b id="gold">120</b></button>
    <button class="resource-btn" data-open="herbs"><img id="resHerbArt" alt=""><b id="herbs">8</b></button>
  </section>

  <nav class="quick-menu" aria-label="Menu nhanh">
    <button data-open="mail"><img id="quickMailArt" alt="Thư"><i class="notify" id="mailDot"></i></button>
    <button data-open="rank"><img id="quickRankArt" alt="BXH"></button>
    <button data-open="settings"><img id="quickSettingsArt" alt="Cài đặt"></button>
  </nav>

  <nav class="side-menu side-left" aria-label="Menu bên trái">
    <button data-open="manuals"><img id="side0" alt="Công Pháp"><span>Công Pháp</span></button>
    <button data-open="equipment"><img id="side1" alt="Pháp Bảo"><span>Pháp Bảo</span></button>
    <button data-open="forge"><img id="side2" alt="Luyện Khí"><span>Luyện Khí</span></button>
    <button data-open="alchemy"><img id="side3" alt="Luyện Đan"><span>Luyện Đan</span></button>
    <button data-open="treasures"><img id="side4" alt="Bảo Vật"><span>Bảo Vật</span></button>
  </nav>

  <nav class="side-menu side-right" aria-label="Menu bên phải">
    <button data-open="pills"><img id="side5" alt="Đan Dược"><span>Đan Dược</span></button>
    <button data-open="herbs"><img id="side6" alt="Dược Liệu"><span>Dược Liệu</span></button>
    <button data-open="rift"><img id="side7" alt="Bí Cảnh"><span>Bí Cảnh</span></button>
    <button data-open="sect"><img id="side8" alt="Tông Môn"><span>Tông Môn</span></button>
    <button data-open="world"><img id="side9" alt="Thế Giới"><span>Thế Giới</span></button>
  </nav>

  <section class="cultivation-zone">
    <img id="quoteArt" class="quote-art" alt="">
    <div class="quote-text">“Đạo tâm bất diệt, vạn pháp giai khả thành.”</div>
    <div class="cult-track"><i id="cultFill"></i></div>
    <b id="cultText">Tu Vi: 0 / 100</b>
    <button id="fast" class="fast-btn"><img id="fastArt" alt="Tăng Nhanh"></button>
  </section>

  <section class="main-actions" aria-label="Hành động chính">
    <button id="cultivate" aria-label="Tu luyện"><img id="action0" alt="Tu luyện"></button>
    <button id="explore" aria-label="Thám hiểm"><img id="action1" alt="Thám hiểm"></button>
    <button id="hunt" aria-label="Trảm yêu"><img id="action2" alt="Trảm yêu"></button>
    <button id="breakthrough" aria-label="Đột phá"><img id="action3" alt="Đột phá"></button>
  </section>

  <section class="stats-zone">
    <img id="statsPanelArt" class="zone-art" alt="">
    <div class="stat-grid">
      <div><img id="stat0" alt=""><span>Khí Huyết</span><b id="hp">100/100</b></div>
      <div><img id="stat1" alt=""><span>Công Kích</span><b id="atk">10</b></div>
      <div><img id="stat2" alt=""><span>Phòng Thủ</span><b id="def">8</b></div>
      <div><img id="stat3" alt=""><span>Né Tránh</span><b id="dodge">5%</b></div>
      <div><img id="stat4" alt=""><span>Tỷ Lệ Bạo</span><b id="crit">5%</b></div>
    </div>
  </section>

  <section class="bottom-zone">
    <div class="log-wrap">
      <img id="logPanelArt" class="zone-art" alt="">
      <div id="log" class="log-content"></div>
    </div>
    <button class="location-card" id="nextLoc">
      <img src="./assets/location.webp" alt="Khu vực hiện tại">
      <span id="loc">Sơn Ngoại Thanh Minh</span><b>›</b>
    </button>
  </section>

  <div id="modal" class="overlay"><div class="window" id="modalBody"></div></div>
  <div id="combat" class="overlay"><div class="window" id="combatBody"></div></div>
</main>
<script src="./asset-runtime.js"></script>
<script src="./game.js"></script>
</body>
</html>
