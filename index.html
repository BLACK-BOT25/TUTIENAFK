<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08111d">
<title>Tu Tiên AFK</title>
<link rel="stylesheet" href="./game.css">
</head>
<body>
<div id="app">
  <div class="hud profile">
    <img class="avatar" src="./assets/avatar.webp" alt="">
    <div class="ptext"><b id="name">Diệp Mặc</b><span id="realm">Luyện Khí tầng 1</span><div class="mini"><i id="miniFill"></i><em id="miniText">0 / 100 Tu Vi</em></div></div>
  </div>
  <div class="resources">
    <button class="res" data-open="shop"><span>💎</span><b id="gems">30</b><i>＋</i></button>
    <button class="res" data-open="shop"><span>🪙</span><b id="gold">120</b><i>＋</i></button>
    <button class="res" data-open="herbs"><span>🌿</span><b id="herbs">8</b><i>＋</i></button>
  </div>
  <div class="quick">
    <button data-open="mail"><span>✉️</span><small>Thư</small><i class="red-dot" id="mailDot"></i></button>
    <button data-open="rank"><span>🏆</span><small>BXH</small></button>
    <button data-open="settings"><span>⚙️</span><small>Cài đặt</small></button>
  </div>
  <div class="side left">
    <button data-open="manuals"><i class="sprite s0"></i><b>Công Pháp</b></button>
    <button data-open="equipment"><i class="sprite s1"></i><b>Pháp Bảo</b></button>
    <button data-open="forge"><i class="sprite s2"></i><b>Luyện Khí</b></button>
    <button data-open="alchemy"><i class="sprite s3"></i><b>Luyện Đan</b></button>
    <button data-open="treasures"><i class="sprite s4"></i><b>Bảo Vật</b></button>
  </div>
  <div class="side right">
    <button data-open="pills"><i class="sprite s5"></i><b>Đan Dược</b></button>
    <button data-open="herbs"><i class="sprite s6"></i><b>Dược Liệu</b></button>
    <button data-open="rift"><i class="sprite s7"></i><b>Bí Cảnh</b></button>
    <button data-open="sect"><i class="sprite s8"></i><b>Tông Môn</b></button>
    <button data-open="world"><i class="sprite s9"></i><b>Thế Giới</b></button>
  </div>
  <section class="cult-box">
    <div class="quote">“Đạo tâm bất diệt, vạn pháp giai khả thành.”</div>
    <div class="bar"><i id="cultFill"></i></div>
    <b id="cultText">Tu Vi: 0 / 100</b>
  </section>
  <button id="fast" class="fast">⚡ Tăng Nhanh</button>
  <div class="main-actions">
    <button class="act a0" id="cultivate"><b>Tu luyện</b><small>Hấp thu linh khí</small></button>
    <button class="act a1" id="explore"><b>Thám hiểm</b><small>Khám phá thiên hạ</small></button>
    <button class="act a2" id="hunt"><b>Trảm yêu</b><small>Rèn luyện bản thân</small></button>
    <button class="act a3" id="breakthrough"><b>Đột phá</b><small>Vượt qua bình cảnh</small></button>
  </div>
  <div class="stats">
    <div><span>❤️</span><small>Khí Huyết</small><b id="hp">100/100</b></div>
    <div><span>⚔️</span><small>Công Kích</small><b id="atk">10</b></div>
    <div><span>🛡️</span><small>Phòng Thủ</small><b id="def">8</b></div>
    <div><span>👟</span><small>Né Tránh</small><b id="dodge">5%</b></div>
    <div><span>🍀</span><small>Tỷ Lệ Bạo</small><b id="crit">5%</b></div>
  </div>
  <div class="bottom">
    <div class="log" id="log"></div>
    <button class="location" id="nextLoc"><b id="loc">Sơn Ngoại Thanh Minh</b><span>›</span></button>
  </div>
  <div id="modal" class="overlay"><div class="window" id="modalBody"></div></div>
  <div id="combat" class="overlay"><div class="window" id="combatBody"></div></div>
</div>
<script src="./game.js"></script>
</body>
</html>
